[package]
edition      = "2024"
name         = "test_bench"
rust-version = "1.88"
version      = "0.1.0"

[lib]
test = false
bench = false

[[bin]]
name = "test_bench"
path = "./src/bin/main.rs"
test = false
bench = false

[dependencies]
esp-hal = { version = "~1.0", features = ["esp32c6","unstable"] }

esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32c6"] }

esp-println = { version = "0.17.0", features = ["esp32c6"] }
heapless = "0.9.3"
embedded-io = "0.6.1"


[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
